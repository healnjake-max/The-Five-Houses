<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Five Houses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a night street of five lit houses. Glass house-cards in a row (scroll-snap on phones), HUD of timer / attempts / progress above, clue ledger that folds away, one big amber finish button below. */
:root {
  --bg: #0a0f1f;
  --bg-deep: #070b17;
  --ink: #eef1fb;
  --muted: #98a2c3;
  --glass: rgba(255, 255, 255, 0.055);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.12);
  --amber: #f6b94f;
  --amber-deep: #ff8a4c;
  --teal: #5fd3c5;
  --bad: #ff7070;
  --good: #5fe3a1;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(95, 211, 197, 0.14), transparent 60%),
    radial-gradient(800px 560px at 100% 8%, rgba(246, 185, 79, 0.13), transparent 60%),
    radial-gradient(1200px 700px at 50% 120%, rgba(60, 80, 170, 0.28), transparent 60%),
    linear-gradient(180deg, #0c1228 0%, #080c1a 100%);
}
#root { position: relative; z-index: 1; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 44px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { font: 800 15px/1 var(--display); letter-spacing: 0.22em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.top-actions { display: flex; gap: 8px; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 9px 14px; border-radius: 12px; font-weight: 600; font-size: 12.5px; letter-spacing: 0.08em;
  transition: background 0.2s, transform 0.2s, border-color 0.2s;
}
.btn-ghost:hover { background: var(--glass-strong); border-color: rgba(255,255,255,.22); }
.btn-ghost:active { transform: scale(0.97); }
.btn-ghost.icon { padding: 9px 11px; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr 1.5fr 1.2fr; gap: 12px; margin-bottom: 14px; }
.tile {
  background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.8);
  min-width: 0;
}
.tile .k { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; font-weight: 600; }
.timer { font: 700 30px/1.1 var(--mono); font-variant-numeric: tabular-nums; margin-top: 6px; }
.att-l { font: 700 12.5px/1.2 var(--body); letter-spacing: 0.14em; color: var(--muted); }
.att-l b { font: 800 28px/1 var(--display); color: var(--amber); letter-spacing: 0; margin-left: 6px; vertical-align: -3px; }
.pips { display: flex; gap: 8px; margin-top: 10px; }
.pip { height: 8px; flex: 1; border-radius: 6px; background: var(--amber); box-shadow: 0 0 14px rgba(246,185,79,.55); transition: background .4s, box-shadow .4s; }
.pip.off { background: rgba(255,255,255,.12); box-shadow: none; }
.prog-n { font: 700 24px/1.1 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.prog-n span { color: var(--muted); font-size: 15px; }
.bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 6px; margin-top: 10px; overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--teal), var(--amber)); border-radius: 6px; transition: width .45s cubic-bezier(.2,.8,.2,1); }

/* clues */
.clues { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.clues-head { width: 100%; background: none; border: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; text-align: left; }
.clues-head .t { font: 800 16px/1.2 var(--display); letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.clues-head .sub { color: var(--muted); font-size: 12.5px; font-weight: 500; letter-spacing: 0.02em; text-transform: none; font-family: var(--body); }
.chev { transition: transform .3s; flex: none; }
.chev.open { transform: rotate(180deg); }
.clues-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1); }
.clues-body.open { grid-template-rows: 1fr; }
.clues-body > div { overflow: hidden; min-height: 0; }
.clue-list { list-style: none; margin: 0; padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
.clue {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start;
  background: rgba(8, 12, 26, 0.45); border: 1px solid transparent; border-radius: 14px; padding: 11px 13px;
  transition: border-color .2s, opacity .25s, background .2s;
}
.clue:hover { border-color: var(--line); }
.clue .n { font: 700 12px/1 var(--mono); color: var(--amber); background: rgba(246,185,79,.12); border-radius: 8px; min-width: 28px; height: 24px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.clue .tx { font-size: 14px; line-height: 1.45; min-width: 0; }
.clue.struck { opacity: .45; }
.clue.struck .tx { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.4); }
.clue.struck .n { color: var(--teal); background: rgba(95,211,197,.14); }
.clues-note { padding: 0 20px 14px; color: var(--muted); font-size: 12.5px; }

/* board */
.board-wrap { position: relative; }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; position: relative; }
.house {
  background: var(--glass); border: 1px solid var(--line); border-radius: 24px; padding: 14px 12px 14px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 24px 50px -28px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255,255,255,.07);
  transition: border-color .35s, box-shadow .35s, transform .35s;
  animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  min-width: 0;
}
.house.done { border-color: rgba(246,185,79,.55); box-shadow: 0 24px 60px -26px rgba(246,185,79,.45), inset 0 1px 0 rgba(255,255,255,.07); }
.house.shake { animation: shake .55s; border-color: rgba(255,112,112,.7); }
.house-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.house-num { font: 800 13px/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; }
.house-num b { font-size: 22px; color: var(--amber); letter-spacing: 0; margin-left: 6px; vertical-align: -2px; }
.house-count { font: 700 11px/1 var(--mono); color: var(--muted); padding: 5px 8px; border-radius: 20px; background: rgba(255,255,255,.07); transition: background .3s, color .3s; }
.house.done .house-count { background: rgba(246,185,79,.18); color: var(--amber); }
.art { display: block; width: 100%; max-width: 150px; margin: 4px auto 8px; overflow: visible; }
.art .wall, .art .roof, .art .chim { transition: fill .5s; }
.art .win { transition: fill .5s; }
.art .lit { animation: flicker 3.2s ease-in-out infinite; }
.cells { display: grid; gap: 9px; }
.cell { display: block; }
.cl { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 2px 4px; }
.sel { position: relative; display: block; }
.sel select {
  width: 100%; appearance: none; -webkit-appearance: none; background: rgba(8, 12, 26, 0.6); border: 1px solid var(--line);
  color: var(--ink); font: 600 14px/1.2 var(--body); padding: 11px 32px 11px 12px; border-radius: 12px; cursor: pointer;
  transition: border-color .25s, background .25s, box-shadow .25s; text-overflow: ellipsis; min-width: 0;
}
.sel select:hover { border-color: rgba(255,255,255,.28); }
.sel select option { background: #10183a; color: #eef1fb; }
.sel .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); display: flex; }
.cell.filled .sel select { border-color: rgba(95,211,197,.55); background: rgba(95,211,197,.09); }
.cell.filled .sel .ic { color: var(--teal); }
.cell.flash .sel select { animation: moved 1.1s ease-out; }

.dots { display: none; justify-content: center; gap: 10px; margin: 0 0 12px; }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); font: 700 14px/1 var(--display); display: grid; place-items: center; transition: all .3s; }
.dot.on { border-color: var(--amber); color: var(--amber); background: rgba(246,185,79,.1); }
.dot.part { border-color: rgba(95,211,197,.6); }

/* finish */
.finish-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 26px; }
.btn-main {
  position: relative; border: 0; border-radius: 18px; padding: 20px 40px; width: min(100%, 520px);
  background: linear-gradient(135deg, var(--amber), var(--amber-deep)); color: #1a1205;
  font: 800 17px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 18px 40px -14px rgba(255, 138, 76, .6), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform .2s, box-shadow .2s, filter .2s; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
}
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 24px 50px -14px rgba(255, 138, 76, .75), inset 0 1px 0 rgba(255,255,255,.4); filter: brightness(1.05); }
.btn-main:active { transform: translateY(0) scale(.985); }
.btn-main.sm { padding: 15px 30px; width: auto; font-size: 14px; }
.btn-line { border: 1px solid var(--line); background: var(--glass); border-radius: 16px; padding: 15px 28px; font: 700 13.5px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; transition: background .2s, transform .2s; }
.btn-line:hover { background: var(--glass-strong); }
.btn-line:active { transform: scale(.98); }
.hint { color: var(--muted); font-size: 13px; text-align: center; }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40; max-width: min(92vw, 460px); width: max-content;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding: 13px 18px; border-radius: 14px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center;
  background: rgba(20, 28, 58, .92); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px -10px rgba(0,0,0,.7); animation: toastin .35s cubic-bezier(.2,.8,.2,1);
}
.toast.warn { border-color: rgba(246,185,79,.6); }
.toast.warn svg { color: var(--amber); }

/* modal */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(5, 8, 18, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; animation: fade .25s both; }
.modal {
  width: min(100%, 440px); text-align: center; padding: 32px 26px 26px; border-radius: 26px;
  background: linear-gradient(180deg, rgba(34,44,86,.92), rgba(16,22,48,.95)); border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 40px 90px -20px rgba(0,0,0,.8); animation: pop .4s cubic-bezier(.2,1.1,.3,1) both;
}
.modal h2 { font: 800 clamp(28px, 7vw, 38px)/1.05 var(--display); margin: 0 0 10px; letter-spacing: .02em; }
.modal p { color: var(--muted); margin: 0 0 20px; }
.modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal .badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; background: rgba(255,112,112,.14); color: var(--bad); border: 1px solid rgba(255,112,112,.4); }
.modal .badge.warn { background: rgba(246,185,79,.14); color: var(--amber); border-color: rgba(246,185,79,.45); }
.modal .left { display: inline-flex; gap: 8px; align-items: center; font: 700 13px/1 var(--body); letter-spacing: .14em; color: var(--amber); margin-bottom: 22px; }

/* landing */
.landing { min-height: calc(100vh - 36px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; padding-block: 30px; }
.street { display: flex; gap: clamp(6px, 2vw, 20px); align-items: flex-end; justify-content: center; margin-bottom: 8px; }
.street .art { width: clamp(52px, 13vw, 118px); margin: 0; }
.street .art-wrap { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.title { font: 800 clamp(44px, 11vw, 112px)/.92 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; text-transform: uppercase;
  background: linear-gradient(180deg, #fff 30%, #b9c3e8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title em { font-style: normal; background: linear-gradient(135deg, var(--amber), var(--amber-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: clamp(16px, 3.4vw, 21px); color: var(--muted); max-width: 30ch; margin: 0; text-wrap: balance; }
.only { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 40px; border: 1px solid rgba(246,185,79,.5); background: rgba(246,185,79,.08); font: 800 13px/1 var(--display); letter-spacing: .22em; color: var(--amber); }
.only .pips { margin: 0; gap: 5px; }
.only .pip { width: 22px; flex: none; }
.facts { display: flex; gap: 8px 22px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.facts span b { color: var(--ink); font-family: var(--mono); }

/* result screens */
.result { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-block: 28px; }
.result h1 { font: 800 clamp(46px, 12vw, 104px)/.95 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .02em; }
.result h1.win { background: linear-gradient(135deg, #fff2c9, var(--amber) 45%, var(--amber-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result h1.lose { color: var(--bad); }
.result p.lead { color: var(--muted); font-size: 18px; margin: 0; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.stat { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 12px 20px; }
.stat .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat .v { font: 700 22px/1.2 var(--mono); }
.sol { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 8px; text-align: left; }
.sol .house { animation-delay: 0s; padding: 12px; }
.sol dl { margin: 0; display: grid; gap: 6px; }
.sol dl div { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; border-bottom: 1px dashed rgba(255,255,255,.1); padding-bottom: 5px; }
.sol dl div:last-child { border-bottom: 0; }
.sol dt { color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.sol dd { margin: 0; font-weight: 700; text-align: right; }
.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.88) translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes moved { 0% { box-shadow: 0 0 0 0 rgba(246,185,79,.8); border-color: var(--amber); } 100% { box-shadow: 0 0 0 12px rgba(246,185,79,0); } }
@keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: .82; } }

@media (max-width: 1040px) {
  .board { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding: 4px 2px 14px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .house { flex: 0 0 min(76vw, 270px); scroll-snap-align: center; }
  .dots { display: flex; }
}
@media (max-width: 720px) {
  .hud { grid-template-columns: 1fr 1fr; }
  .hud .tile.att { grid-column: 1 / -1; order: -1; }
  .btn-ghost .lbl { display: none; }
  .btn-ghost.reset .lbl { display: inline; }
  .clue-list { grid-template-columns: 1fr; }
  .timer { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>

(function () {
  'use strict';
  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useCallback = React.useCallback;

  var CATS = [
    { key: 'nat', label: 'Nationality', icon: 'flag', opts: ['British', 'Swedish', 'Spanish', 'American', 'German'] },
    { key: 'col', label: 'Color', icon: 'palette', opts: ['Dark Brown', 'Red', 'Natural Wood', 'Black', 'White'] },
    { key: 'drk', label: 'Drink', icon: 'cup', opts: ['Tea', 'Coffee', 'Milk', 'Beer', 'Wine'] },
    { key: 'ins', label: 'Instrument', icon: 'music', opts: ['Violin', 'Saxophone', 'Drums', 'Trumpet', 'Piano'] },

  ];
  var HCOL = ['#6b4430', '#d9433f', '#d8b07a', '#1c1c26', '#f3f1ea'];
  var SOL = {
    nat: ['American', 'Spanish', 'British', 'German', 'Swedish'],
    col: ['Black', 'White', 'Dark Brown', 'Red', 'Natural Wood'],
    drk: ['Wine', 'Tea', 'Milk', 'Coffee', 'Beer'],
    ins: ['Saxophone', 'Drums', 'Violin', 'Piano', 'Trumpet'],
    pet: ['Cat', 'Horse', 'Bird', 'Fish', 'Dog']
  };
  var SOL_IDX = CATS.map(function (c) { return SOL[c.key].map(function (n) { return c.opts.indexOf(n); }); });
  var CLUES = [
    'The British man lives in a dark brown house.',
    'The Swedish man owns a dog.',
    'The Spanish man drinks tea.',
    'The red house is on the left of the natural wood house.',
    'The owner of the red house drinks coffee.',
    'The person who plays violin owns a bird.',
    'The owner of the black house plays the saxophone.',
    'The man living in the centre house drinks milk.',
    'The American lives in the first house.',
    'The man who plays the drums lives next to the one who owns a cat.',
    'The man who owns a horse lives next to the man who plays saxophone.',
